<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Voice Submission</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 20px;
      background-color: #f8fafc;
      color: #1e293b;
    }
    .container {
      max-width: 450px;
      margin: 0 auto;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
    }
    h2 { text-align: center; color: #0f172a; margin-top: 0; }
    label { display: block; margin-top: 15px; font-weight: 600; font-size: 0.9em; }
    input, select {
      width: 100%; padding: 12px; margin-top: 5px;
      border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box;
      font-size: 14px;
    }
    .recording-box {
      border: 2px dashed #cbd5e1; border-radius: 8px;
      padding: 20px; text-align: center; margin: 20px 0; background: #fafafa;
    }
    .timer { font-family: monospace; font-size: 1.8em; font-weight: bold; color: #2563eb; }
    button {
      width: 100%; padding: 12px; border: none; border-radius: 6px;
      font-weight: 600; cursor: pointer; transition: 0.2s ease; margin-top: 10px;
      font-size: 15px;
    }
    .btn-record { background-color: #2563eb; color: white; }
    .btn-record:hover { background-color: #1d4ed8; }
    .btn-stop { background-color: #dc2626; color: white; }
    .btn-stop:hover { background-color: #b91c1c; }
    .btn-submit { background-color: #16a34a; color: white; }
    .btn-submit:hover { background-color: #15803d; }
    button:disabled { background-color: #cbd5e1; cursor: not-allowed; }
    #status { margin-top: 15px; text-align: center; font-weight: 600; font-size: 0.95em; color: #64748b; }
    audio { width: 100%; margin-top: 15px; }
  </style>
</head>
<body>

<div class="container">
  <h2>Student Voice Submission</h2>

  <label for="name">Full Name</label>
  <input type="text" id="name" placeholder="Enter full name" required>

  <label for="grade">Grade Level</label>
  <select id="grade">
    <option value="">-- Select Grade --</option>
    <option value="6">Grade 6</option>
    <option value="7">Grade 7</option>
    <option value="8">Grade 8</option>
    <option value="9">Grade 9</option>
    <option value="10">Grade 10</option>
    <option value="11">Grade 11</option>
  </select>

  <label for="exam">Language / Exam</label>
  <select id="exam">
    <option value="">-- Select Exam --</option>
    <option value="MS French">MS French</option>
    <option value="MS Spanish">MS Spanish</option>
    <option value="MS Chinese">MS Chinese</option>
    <option value="US French">US French</option>
    <option value="US Spanish">US Spanish</option>
    <option value="US Chinese">US Chinese</option>
  </select>

  <div class="recording-box">
    <div id="timer" class="timer">00:00</div>
    <button id="recordBtn" class="btn-record" onclick="startRecording()">🎙️ Start Recording</button>
    <button id="stopBtn" class="btn-stop" onclick="stopRecording()" disabled>⏹️ Stop Recording</button>
  </div>

  <div id="previewArea"></div>
  
  <button id="submitBtn" class="btn-submit" onclick="submitForm()" disabled>📤 Submit Assignment</button>
  <div id="status">Complete form & recording to submit</div>
</div>

<script>
  // Replace this with your Google Apps Script Web App URL ending in /exec
  const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwP8CdTTFVpkPjwI19RvHqMVgwi9Om9dmMlEpBtX5Gmu8LZciJC8emQ_KLwS-B4cAg/exec";

  let mediaRecorder;
  let audioChunks = [];
  let timerInterval;
  let secondsElapsed = 0;
  let recordedAudioBase64 = null;

  function validateForm() {
    const name = document.getElementById('name').value.trim();
    const grade = document.getElementById('grade').value;
    const exam = document.getElementById('exam').value;
    if (!name || !grade || !exam) {
      alert("Please fill out your Name, Grade, and Exam selection before proceeding.");
      return false;
    }
    return true;
  }

  async function startRecording() {
    if (!validateForm()) return;

    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mediaRecorder = new MediaRecorder(stream);
      audioChunks = [];

      mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
      mediaRecorder.onstop = () => {
        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
        const reader = new FileReader();
        reader.readAsDataURL(audioBlob);
        reader.onloadend = () => {
          recordedAudioBase64 = reader.result;
          document.getElementById('previewArea').innerHTML = `<audio controls src="${URL.createObjectURL(audioBlob)}"></audio>`;
          document.getElementById('submitBtn').disabled = false;
          document.getElementById('status').innerText = "Recording ready! Click Submit Assignment.";
          document.getElementById('status').style.color = "#16a34a";
        };
        stream.getTracks().forEach(track => track.stop());
      };

      mediaRecorder.start();
      secondsElapsed = 0;
      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        secondsElapsed++;
        const mins = Math.floor(secondsElapsed / 60).toString().padStart(2, '0');
        const secs = (secondsElapsed % 60).toString().padStart(2, '0');
        document.getElementById('timer').innerText = `${mins}:${secs}`;
      }, 1000);

      document.getElementById('recordBtn').disabled = true;
      document.getElementById('stopBtn').disabled = false;
      document.getElementById('status').innerText = "Recording in progress...";
      document.getElementById('status').style.color = "#dc2626";
    } catch (err) {
      alert("Microphone permission denied or unavailable: " + err.message);
    }
  }

  function stopRecording() {
    if (mediaRecorder && mediaRecorder.state !== "inactive") {
      mediaRecorder.stop();
      clearInterval(timerInterval);
      document.getElementById('recordBtn').disabled = false;
      document.getElementById('stopBtn').disabled = true;
    }
  }

  async function submitForm() {
    if (!validateForm()) return;
    if (!recordedAudioBase64) {
      alert("Please record audio before submitting.");
      return;
    }

    const submitBtn = document.getElementById('submitBtn');
    const statusDiv = document.getElementById('status');
    
    submitBtn.disabled = true;
    statusDiv.innerText = "Uploading recording to Google Drive & logging to Sheet...";
    statusDiv.style.color = "#2563eb";

    const studentInfo = {
      name: document.getElementById('name').value.trim(),
      grade: document.getElementById('grade').value,
      exam: document.getElementById('exam').value
    };

    const fileName = `${studentInfo.name}_Grade${studentInfo.grade}_${studentInfo.exam}.webm`;

    const payload = {
      rawDataUrl: recordedAudioBase64,
      fileName: fileName,
      studentInfo: studentInfo
    };

    try {
      await fetch(APPS_SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload),
        redirect: "follow"
      });

      statusDiv.innerText = "✅ Submitted successfully!";
      statusDiv.style.color = "#16a34a";
      
      setTimeout(() => {
        location.reload();
      }, 3000);

    } catch (err) {
      statusDiv.innerText = "Error submitting form: " + err.message;
      statusDiv.style.color = "#dc2626";
      submitBtn.disabled = false;
    }
  }
</script>
</body>
</html>
